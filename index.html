<style>
/* ==========================================================================
   Tokens
   ========================================================================== */
:root {
  --ink: #111111;
  --cream: #EADDCA;
  --red: #C7352A;

  --surface: #181818;
  --surface-2: #202020;
  --line: rgba(234, 221, 202, 0.14);
  --line-strong: rgba(234, 221, 202, 0.32);
  --dim: rgba(234, 221, 202, 0.52);
  --faint: rgba(234, 221, 202, 0.30);
  --wash: rgba(234, 221, 202, 0.07);
  --red-wash: rgba(199, 53, 42, 0.14);

  --sans: 'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  --radius: 3px;
  --radius-sm: 2px;
}

/* ==========================================================================
   Base
   ========================================================================== */
html, body {
  margin: 0;
  padding: 0;
  background: var(--ink);
  overscroll-behavior: none;
}
body { -webkit-text-size-adjust: 100%; }
* { box-sizing: border-box; }

.app {
  font-family: var(--sans);
  background: var(--ink);
  color: var(--cream);
  min-height: 100vh;
  max-width: 520px;
  margin: 0 auto;
  padding: 18px 16px 40px;
  -webkit-tap-highlight-color: transparent;
}
/* Wrapped in :where() so this reset carries no specificity — otherwise `.app button`
   would outrank single-class rules like `.chip` and strip their surfaces. */
:where(.app button) {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
  color: inherit;
}
h1, h2 { margin: 0; font-weight: 800; letter-spacing: -0.03em; }
p { margin: 0; }
a { color: inherit; }

/* Shared type roles ------------------------------------------------------- */
.ar { color: var(--dim); font-size: 15px; }
.hint { color: var(--dim); font-size: 12px; line-height: 1.55; margin: 0 0 16px; }
.label {
  color: var(--dim);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.16em;
  margin: 24px 0 10px;
}
.num-text { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.stack { display: flex; flex-direction: column; gap: 8px; }

/* ==========================================================================
   Controls
   ========================================================================== */
.field {
  width: 100%;
  padding: 14px 16px;
  font: inherit;
  font-size: 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  color: var(--cream);
}
.field:focus { outline: 2px solid var(--cream); outline-offset: -1px; }
.field::placeholder { color: var(--faint); }

.picker { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.picker.tight { gap: 6px; }

.chip {
  padding: 13px 8px;
  border-radius: var(--radius);
  background: var(--surface-2);
  border: 1px solid var(--line);
  font-size: 14px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.chip.on { background: var(--cream); border-color: var(--cream); color: var(--ink); }
.chip:disabled { opacity: 0.28; }

.mode {
  text-align: left;
  padding: 14px 16px;
  border-radius: var(--radius);
  background: var(--surface);
  border: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.mode.on { border-color: var(--cream); background: var(--wash); }
.mode-name { font-size: 15px; font-weight: 700; }
.mode-blurb { font-size: 12px; color: var(--dim); line-height: 1.45; }

.primary {
  width: 100%;
  margin-top: 20px;
  padding: 16px;
  border-radius: var(--radius);
  background: var(--cream);
  color: var(--ink);
  font-size: 15px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

  margin-top: 36px;

@media (prefers-reduced-motion: reduce) {

</head>
<body>
<div id="root"></div>
<script>
(() => {
  'use strict';

  /* ========================================================================
     Game rules
     ====================================================================== */

  // Every contract a kingdom can contain, with its Arabic name and its cost.
  // `total` is what the whole table nets on that contract once the hand is complete —
  // doubling only moves points between players, so it never changes the total.
  const CONTRACTS = {
    complex:      { name: 'Complex',        ar: 'كومبلكس', glyph: '✦',  cost: '−500',     total: -500 },
    kingOfHearts: { name: 'King of Hearts', ar: 'شيخ كوبة', glyph: 'K♥', cost: '−75',      total: -75,  red: true },
    diamonds:     { name: 'Diamonds',       ar: 'ديناري',  glyph: '♦',  cost: '−10 each', total: -130, red: true },
    queens:       { name: 'Queens',         ar: 'بنات',    glyph: 'Q',  cost: '−25 each', total: -100 },
    collection:   { name: 'Tricks',         ar: 'لطوشة',   glyph: '≡',  cost: '−15 each', total: -195 },
    trex:         { name: 'Trex',           ar: 'تريكس',   glyph: 'J',  cost: '+500',     total: 500 },
  };

  // The two ways a kingdom gets dealt out.
  const MODES = {
    complex: {
      label: 'Complex',
      blurb: 'All four losing games in one hand, then Trex. Two hands per kingdom.',
      contracts: ['complex', 'trex'],
    },
    classic: {
      label: 'Classic',
      blurb: 'Each losing game dealt separately. Five hands per kingdom.',
      contracts: ['kingOfHearts', 'diamonds', 'queens', 'collection', 'trex'],
    },
  };

  const SUITS = ['♠', '♥', '♦', '♣'];
  const TREX_POINTS = [200, 150, 100, 50];   // 1st through 4th out
  const TRICKS_PER_HAND = 13;
  const PLAYERS = 4;
  const KINGDOMS = 4;
  const PLACES = ['1st', '2nd', '3rd', '4th'];

  const sum = (list) => list.reduce((a, b) => a + b, 0);

  /* ========================================================================
     Storage
     ====================================================================== */

  const STORAGE_KEY = 'trex:game:v2';

  const storage = {
    load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch {
        return null;
      }
    },
    save(game) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(game));
      } catch {
        /* private mode / quota — the game still plays, it just won't survive a reload */
      }
    },
    clear() {
      try {
        localStorage.removeItem(STORAGE_KEY);
      } catch {}
    },
  };

  /* ========================================================================
     Hand data
     ====================================================================== */

  // A "taker" records who won a single penalty card, plus any doubling around it.
  const takerEntry = (suit) => ({
    suit,
    taker: null,
    doubled: false,
    doubledBy: null,
    selfLed: false,
    leader: null,
  });

  const queenSet = () => SUITS.map(takerEntry);
  const zeroes = () => new Array(PLAYERS).fill(0);

  function blankHandData(contract) {
    switch (contract) {
      case 'complex':
        return { tricks: zeroes(), king: takerEntry('♥'), queens: queenSet(), diamonds: zeroes() };
      case 'kingOfHearts': return { king: takerEntry('♥') };
      case 'diamonds':     return { diamonds: zeroes() };
      case 'queens':       return { queens: queenSet() };
      case 'collection':   return { tricks: zeroes() };
      case 'trex':         return { order: [] };
      default:             return {};
    }
  }

  // A taker is settled once we know who took it and — if doubled — how the double resolves.
  const takerSettled = (entry) =>
    entry.taker != null &&
    (!entry.doubled ||
      (entry.doubledBy != null &&
        (entry.taker !== entry.doubledBy || entry.selfLed || entry.leader != null)));

  function handIsComplete(contract, data) {
    switch (contract) {
      case 'complex':
        return sum(data.tricks) === TRICKS_PER_HAND &&
          sum(data.diamonds) === TRICKS_PER_HAND &&
          takerSettled(data.king) &&
          data.queens.every(takerSettled);
      case 'kingOfHearts': return takerSettled(data.king);
      case 'diamonds':     return sum(data.diamonds) === TRICKS_PER_HAND;
      case 'queens':       return data.queens.every(takerSettled);
      case 'collection':   return sum(data.tricks) === TRICKS_PER_HAND;
      case 'trex':         return data.order.length === PLAYERS;
      default:             return false;
    }
  }

  /* ========================================================================
     Scoring
     ====================================================================== */

  // Charge one penalty card, honouring whoever doubled it.
  //   - doubled by someone else       → taker pays double, the doubler collects
  //   - doubled by the taker, self-led → taker pays single
  //   - doubled by the taker otherwise → taker pays double, the trick's leader collects
  function chargeTaker(scores, entry, amount) {
    if (!entry.doubled || entry.doubledBy == null) {
      scores[entry.taker] -= amount;
      return;
    }
    const by = entry.doubledBy;
    if (entry.taker !== by) {
      scores[entry.taker] -= amount * 2;
      scores[by] += amount;
    } else if (entry.selfLed) {
      scores[by] -= amount;
    } else {
      scores[by] -= amount * 2;
      if (entry.leader != null) scores[entry.leader] += amount;
    }
  }

  const chargeCounts = (scores, counts, perCard) =>
    counts.forEach((n, i) => { scores[i] -= n * perCard; });

  function scoreHand(hand) {
    const scores = zeroes();
    const d = hand.data;
    switch (hand.contract) {
      case 'complex':
        chargeTaker(scores, d.king, 75);
        d.queens.forEach((q) => chargeTaker(scores, q, 25));
        chargeCounts(scores, d.diamonds, 10);
        chargeCounts(scores, d.tricks, 15);
        break;
      case 'kingOfHearts': chargeTaker(scores, d.king, 75); break;
      case 'diamonds':     chargeCounts(scores, d.diamonds, 10); break;
      case 'queens':       d.queens.forEach((q) => chargeTaker(scores, q, 25)); break;
      case 'collection':   chargeCounts(scores, d.tricks, 15); break;
      case 'trex':         d.order.forEach((player, place) => { scores[player] += TREX_POINTS[place]; }); break;
    }
    return scores;
  }

  // In a Complex hand every penalty card lives inside a trick someone took, so a
  // player holding more penalties than their tricks could hold means a miscount.
  function complexConflicts(data, names) {
    const notes = [];
    const queensTaken = zeroes();
    data.queens.forEach((q) => { if (q.taker != null) queensTaken[q.taker]++; });
    if (sum(data.tricks) !== TRICKS_PER_HAND) return notes;

    names.forEach((name, i) => {
      const capacity = data.tricks[i] * 4;   // four cards to a trick
      if (data.diamonds[i] > capacity) {
        notes.push(`${name} took ${data.diamonds[i]} diamonds but only ${data.tricks[i]} tricks.`);
      }
      if (queensTaken[i] > capacity) {
        notes.push(`${name} took ${queensTaken[i]} queens but only ${data.tricks[i]} tricks.`);
      }
      if (data.king.taker === i && data.tricks[i] === 0) {
        notes.push(`${name} took the K♥ but no tricks.`);
      }
    });
    return notes;
  }

  /* ========================================================================
     DOM helper
     ====================================================================== */

  // el('button', { class: 'chip', onClick: fn }, 'label')
  // Nested arrays are flattened; null / false / undefined children are dropped.
  function el(tag, props, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(props || {})) {
      if (value == null || value === false) continue;
      if (key === 'class') node.className = value;
      else if (key === 'style') Object.assign(node.style, value);
      else if (key.startsWith('on')) node.addEventListener(key.slice(2).toLowerCase(), value);
      else if (key in node) node[key] = value;
      else node.setAttribute(key, value);
    }
    appendChildren(node, children);
    return node;
  }

  function appendChildren(node, children) {
    for (const child of children) {
      if (child == null || child === false || child === true) continue;
      if (Array.isArray(child)) appendChildren(node, child);
      else node.append(child instanceof Node ? child : String(child));
    }
  }

  const classes = (...names) => names.filter(Boolean).join(' ');
  const signed = (n) => (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(n);

  /* ========================================================================
     State
     ====================================================================== */

  const root = document.getElementById('root');

  const state = {
    game: storage.load(),        // null until a game is set up
    sheet: null,                 // { contract, index } while a hand is open
    setup: { names: ['', '', '', ''], startIdx: null, mode: 'complex' },
    draft: null,                 // the hand being edited in the sheet
  };

  function setState(changes) {
    Object.assign(state, changes);
    if (state.game) storage.save(state.game);
    render();
  }

  // The whole screen is cheap enough to rebuild on every change, but throwing the DOM
  // away also throws away the things the browser was holding for us: the caret in a
  // text field, and how far the page and the open sheet were scrolled. Carry them over.
  function render() {
    const active = document.activeElement;
    const focusKey = active && active.dataset ? active.dataset.focusKey : null;
    const caret = focusKey && 'selectionStart' in active ? active.selectionStart : null;
    const pageScroll = window.scrollY;
    const sheetBody = root.querySelector('.sheet-body');
    const sheetScroll = sheetBody ? sheetBody.scrollTop : 0;

    const screens = [el('div', { class: 'app' }, state.game ? Board() : Setup(), Colophon())];
    if (state.sheet) screens.push(Sheet());
    root.replaceChildren(...screens);

    window.scrollTo(0, pageScroll);
    const nextSheetBody = root.querySelector('.sheet-body');
    if (nextSheetBody) nextSheetBody.scrollTop = sheetScroll;

    if (focusKey) {
      const next = root.querySelector(`[data-focus-key="${focusKey}"]`);
      if (next) {
        next.focus();
        if (caret != null) next.setSelectionRange(caret, caret);
      }
    }
  }

  /* ========================================================================
     Actions
     ====================================================================== */

  function startGame() {
    const { names, startIdx, mode } = state.setup;
    setState({ game: { names: displayNames(names), startIdx, mode, hands: [] } });
  }

  function resetGame() {
    storage.clear();
    setState({ game: null, sheet: null, draft: null });
  }

  // Edits happen on a copy, so closing the sheet without saving changes nothing.
  // The data round-trips through localStorage as JSON anyway, so JSON is a faithful clone.
  const cloneData = (data) => JSON.parse(JSON.stringify(data));

  function openHand(contract, index) {
    const existing = index != null ? state.game.hands[index] : null;
    setState({
      sheet: { contract, index },
      draft: existing ? cloneData(existing.data) : blankHandData(contract),
    });
  }

  function saveHand() {
    const { contract, index } = state.sheet;
    const hands = [...state.game.hands];
    const hand = { contract, data: state.draft };
    if (index == null) hands.push(hand);
    else hands[index] = hand;
    setState({ game: { ...state.game, hands }, sheet: null, draft: null });
  }

  function deleteHand(index) {
    const hands = state.game.hands.filter((_, i) => i !== index);
    setState({ game: { ...state.game, hands }, sheet: null, draft: null });
  }

  const closeSheet = () => setState({ sheet: null, draft: null });
  const updateDraft = (changes) => setState({ draft: { ...state.draft, ...changes } });

  const displayNames = (names) => names.map((n, i) => n.trim() || `Player ${i + 1}`);

  /* ========================================================================
     Setup screen
     ====================================================================== */

  function Setup() {
    const { names, startIdx, mode } = state.setup;
    const shown = displayNames(names);

    return [
      el('header', { class: 'brand' },
        el('h1', null, 'Trex'),
        el('div', { class: 'rule' }),
        el('p', { class: 'ar' }, 'تريكس'),
      ),
      el('p', { class: 'hint' }, 'Enter everyone in seating order, going right around the table.'),

      el('div', { class: 'stack' }, names.map((value, i) =>
        el('input', {
          class: 'field',
          value,
          placeholder: `Player ${i + 1}`,
          maxLength: 14,
          'data-focus-key': `name-${i}`,
          onInput: (e) => {
            const next = names.map((n, j) => (j === i ? e.target.value : n));
            setState({ setup: { ...state.setup, names: next } });
          },
        }),
      )),

      el('p', { class: 'label' }, 'Who was dealt the 7♥?'),
      el('div', { class: 'picker' }, shown.map((name, i) =>
        el('button', {
          class: classes('chip', startIdx === i && 'on'),
          onClick: () => setState({ setup: { ...state.setup, startIdx: i } }),
        }, name),
      )),

      el('p', { class: 'label' }, 'How are you playing?'),
      el('div', { class: 'stack' }, Object.entries(MODES).map(([key, def]) =>
        el('button', {
          class: classes('mode', mode === key && 'on'),
          onClick: () => setState({ setup: { ...state.setup, mode: key } }),
        },
          el('span', { class: 'mode-name' }, def.label),
          el('span', { class: 'mode-blurb' }, def.blurb),
        ),
      )),

      el('button', { class: 'primary', disabled: startIdx == null, onClick: startGame }, 'Start game'),
    ];
  }

  /* ========================================================================
     Board
     ====================================================================== */

  function Board() {
    const { names, startIdx, hands } = state.game;
    const contracts = MODES[state.game.mode].contracts;
    const perKingdom = contracts.length;

    const totals = zeroes();
    hands.forEach((hand) => scoreHand(hand).forEach((points, i) => { totals[i] += points; }));
    const lastHand = hands.length ? scoreHand(hands[hands.length - 1]) : null;

    const kingdom = Math.floor(hands.length / perKingdom);
    const finished = hands.length === perKingdom * KINGDOMS;
    const dealer = finished ? null : (startIdx + kingdom) % PLAYERS;

    const playedThisKingdom = hands.slice(kingdom * perKingdom).map((h) => h.contract);
    const remaining = contracts.filter((c) => !playedThisKingdom.includes(c));

    const best = Math.max(...totals);

    // Hands only net to zero across a full kingdom (−500 of losing games, +500 of Trex),
    // so the running total is measured against what the hands played so far should net —
    // not against zero. Anything left over means a stored hand is malformed.
    const expected = sum(hands.map((hand) => CONTRACTS[hand.contract].total));
    const drift = sum(totals) - expected;

    return [
      el('header', { class: 'top' },
        el('div', null,
          el('h1', null, 'Trex'),
          el('p', { class: 'eyebrow' },
            finished ? 'Game complete' : `Kingdom ${kingdom + 1} of ${KINGDOMS} · ${names[dealer]}`),
        ),
        el('div', { class: 'tools' },
          hands.length > 0 &&
            el('button', { class: 'ghost', onClick: () => deleteHand(hands.length - 1) }, 'Undo'),
          el('button', { class: 'ghost', onClick: resetGame }, 'New game'),
        ),
      ),

      el('section', { class: 'scores' }, names.map((name, i) =>
        el('div', { class: classes('row', finished && totals[i] === best && 'winner') },
          el('div', { class: 'who' },
            el('span', { class: 'name' }, name),
            !finished && i === dealer && el('span', { class: 'tag' }, 'kingdom'),
          ),
          lastHand && lastHand[i] !== 0 &&
            el('span', { class: classes('delta', lastHand[i] > 0 ? 'up' : 'down') }, signed(lastHand[i])),
          el('span', { class: classes('total', totals[i] < 0 && 'down') }, signed(totals[i])),
        ),
      )),

      drift !== 0 &&
        el('p', { class: 'warn' }, `Scores are off by ${drift}. Tap a played hand below to fix it.`),

      !finished && el('section', null,
        el('p', { class: 'label' }, `${names[dealer]} deals`),
        el('div', {
          class: 'tiles',
          style: { gridTemplateColumns: `repeat(${Math.min(remaining.length, 3)}, 1fr)` },
        }, remaining.map((key) => {
          const contract = CONTRACTS[key];
          return el('button', {
            class: classes('tile', contract.red && 'red'),
            onClick: () => openHand(key, null),
          },
            el('span', { class: 'glyph' }, contract.glyph),
            el('span', { class: 'tile-name' }, contract.name),
            el('span', { class: 'tile-cost' }, contract.cost),
          );
        })),
      ),

      el('section', null,
        el('p', { class: 'label' }, 'The four kingdoms'),
        el('div', { class: 'grid' }, Array.from({ length: KINGDOMS }, (_, row) =>
          el('div', { class: 'grid-row' },
            el('span', { class: 'grid-name' }, names[(startIdx + row) % PLAYERS]),
            el('div', { class: 'cells' }, contracts.map((_, col) => {
              const index = row * perKingdom + col;
              const hand = hands[index];
              const wide = perKingdom <= 2 ? 'wide' : '';

              if (!hand) {
                return el('span', {
                  class: classes('cell', 'empty', wide, index === hands.length && 'next'),
                });
              }
              const contract = CONTRACTS[hand.contract];
              return el('button', {
                class: classes('cell', wide, contract.red && 'red'),
                onClick: () => openHand(hand.contract, index),
              },
                contract.glyph,
                wide && el('span', { class: 'cell-name' }, contract.name),
              );
            })),
          ),
        )),
      ),
    ];
  }

  /* ========================================================================
     Hand sheet
     ====================================================================== */

  function Sheet() {
    const { contract: key, index } = state.sheet;
    const contract = CONTRACTS[key];
    const data = state.draft;
    const { names } = state.game;

    const complete = handIsComplete(key, data);
    const preview = complete ? scoreHand({ contract: key, data }) : null;
    const conflicts = key === 'complex' ? complexConflicts(data, names) : [];

    const tricksBlock = () => CountBlock({
      names, counts: data.tricks, unit: 'tricks', note: '−15 each',
      onChange: (tricks) => updateDraft({ tricks }),
    });
    const kingBlock = () => TakerBlock({
      names, entry: data.king, label: 'Who took the K♥?', note: '−75', red: true,
      onChange: (king) => updateDraft({ king }),
    });
    const queenBlocks = () => data.queens.map((queen, i) => TakerBlock({
      names, entry: queen, label: `Who took the Q${queen.suit}?`, note: '−25',
      red: queen.suit === '♥' || queen.suit === '♦',
      onChange: (next) => updateDraft({ queens: data.queens.map((q, j) => (j === i ? next : q)) }),
    }));
    const diamondsBlock = () => CountBlock({
      names, counts: data.diamonds, unit: 'diamonds', note: '−10 each',
      onChange: (diamonds) => updateDraft({ diamonds }),
    });

    const fields = {
      complex:      () => [tricksBlock(), kingBlock(), queenBlocks(), diamondsBlock()],
      collection:   () => tricksBlock(),
      kingOfHearts: () => kingBlock(),
      queens:       () => queenBlocks(),
      diamonds:     () => diamondsBlock(),
      trex:         () => TrexOrder({ names, order: data.order, onChange: (order) => updateDraft({ order }) }),
    };

    return el('div', { class: 'sheet-wrap', onClick: closeSheet },
      el('div', { class: 'sheet', onClick: (e) => e.stopPropagation() },
        el('div', { class: 'handle' }),

        el('header', { class: 'sheet-head' },
          el('div', null,
            el('h2', { class: contract.red ? 'red' : '' },
              el('span', { class: 'sheet-glyph' }, contract.glyph), ' ', contract.name),
            el('p', { class: 'ar' }, contract.ar),
          ),
          el('button', { class: 'ghost', onClick: closeSheet }, 'Close'),
        ),

        el('div', { class: 'sheet-body' },
          el('div', { class: 'stack' }, fields[key]()),
          conflicts.length > 0 &&
            el('div', { class: 'conflict' }, conflicts.map((note) => el('p', null, note))),
        ),

        el('footer', { class: 'sheet-foot' },
          preview && el('div', { class: 'preview' }, names.map((name, i) =>
            el('div', null,
              el('span', { class: 'preview-name' }, name),
              el('span', {
                class: classes('preview-value', preview[i] > 0 ? 'up' : preview[i] < 0 ? 'down' : ''),
              }, signed(preview[i])),
            ),
          )),
          el('div', { class: 'sheet-actions' },
            index != null && el('button', { class: 'danger', onClick: () => deleteHand(index) }, 'Delete'),
            el('button', { class: 'primary', disabled: !complete, onClick: saveHand },
              index != null ? 'Save changes' : 'Save hand'),
          ),
        ),
      ),
    );
  }

  /* ========================================================================
     Sheet fields
     ====================================================================== */

  function PlayerPicker({ names, selected, onPick }) {
    return el('div', { class: 'picker tight' }, names.map((name, i) =>
      el('button', { class: classes('chip', selected === i && 'on'), onClick: () => onPick(i) }, name),
    ));
  }

  // Who took one penalty card, and — if it was doubled — how that double settles.
  function TakerBlock({ names, entry, label, note, red, onChange }) {
    const patch = (changes) => onChange({ ...entry, ...changes });
    const doubledThemselves = entry.doubled && entry.doubledBy != null && entry.taker === entry.doubledBy;

    return el('div', { class: classes('block', entry.taker != null && 'filled') },
      el('div', { class: 'block-label' },
        el('span', { class: red ? 'red' : '' }, label),
        el('span', { class: 'block-meta' },
          note && el('span', { class: 'note' }, note),
          el('button', {
            class: classes('double', entry.doubled && 'on'),
            onClick: () => patch({ doubled: !entry.doubled, doubledBy: null, selfLed: false, leader: null }),
          }, '×2'),
        ),
      ),

      PlayerPicker({ names, selected: entry.taker, onPick: (taker) => patch({ taker }) }),

      entry.doubled && el('div', { class: 'nested' },
        el('p', { class: 'sublabel' }, 'Who exposed it?'),
        PlayerPicker({ names, selected: entry.doubledBy, onPick: (doubledBy) => patch({ doubledBy }) }),

        doubledThemselves && [
          el('button', {
            class: classes('toggle', entry.selfLed && 'on'),
            onClick: () => patch({ selfLed: !entry.selfLed, leader: null }),
          }, 'They led it themselves'),
          !entry.selfLed && [
            el('p', { class: 'sublabel' }, 'Who led that trick?'),
            PlayerPicker({ names, selected: entry.leader, onPick: (leader) => patch({ leader }) }),
          ],
        ],
      ),
    );
  }

  // How many tricks / diamonds each player took — the counts must add up to 13.
  function CountBlock({ names, counts, unit, note, onChange }) {
    const left = TRICKS_PER_HAND - sum(counts);

    const nudge = (i, by) => {
      const next = [...counts];
      next[i] = Math.max(0, Math.min(TRICKS_PER_HAND, next[i] + by));
      if (sum(next) <= TRICKS_PER_HAND) onChange(next);
    };
    const takeRest = (i) => {
      if (left <= 0) return;
      const next = [...counts];
      next[i] += left;
      onChange(next);
    };

    return el('div', { class: classes('block', left === 0 && 'filled') },
      el('div', { class: 'block-label' },
        el('span', null, `How many ${unit} did each player take?`),
        el('span', { class: 'block-meta' },
          note && el('span', { class: 'note' }, note),
          el('span', { class: classes('remaining', left === 0 && 'done') }, `${left} left`),
        ),
      ),

      names.map((name, i) =>
        el('div', { class: 'counter' },
          el('span', { class: 'counter-name' }, name),
          el('button', { class: 'step', onClick: () => nudge(i, -1) }, '−'),
          el('button', { class: 'count', onClick: () => takeRest(i) }, counts[i]),
          el('button', { class: 'step', onClick: () => nudge(i, 1) }, '+'),
        ),
      ),

      left > 0 && el('p', { class: 'hint' }, "Tap a number to give it everything that's left."),
    );
  }

  // The order players went out in a Trex hand.
  function TrexOrder({ names, order, onChange }) {
    return el('div', { class: classes('block', order.length === PLAYERS && 'filled') },
      el('div', { class: 'block-label' },
        el('span', null, 'Tap players in the order they went out'),
      ),

      el('div', { class: 'ranks' }, TREX_POINTS.map((points, place) =>
        el('div', { class: classes('rank', order[place] != null && 'on') },
          el('span', { class: 'place' }, PLACES[place]),
          el('span', { class: 'rank-name' }, order[place] != null ? names[order[place]] : '—'),
          el('span', { class: 'points' }, `+${points}`),
        ),
      )),

      el('div', { class: 'picker tight' }, names.map((name, i) =>
        el('button', {
          class: 'chip',
          disabled: order.includes(i),
          onClick: () => onChange([...order, i]),
        }, name),
      )),

      order.length > 0 &&
        el('button', { class: 'toggle', onClick: () => onChange(order.slice(0, -1)) }, 'Undo last pick'),
    );
  }

  /* ========================================================================
     Colophon
     ====================================================================== */

  function Colophon() {
    return el('footer', { class: 'colophon' },
      el('span', null, 'Built by'),
      el('a', {
        href: 'https://hanialkarrain.com',
        target: '_blank',
        rel: 'noopener noreferrer',
      }, 'hanialkarrain.com'),
    );
  }

  render();
})();
</script>
</body>
</html>
