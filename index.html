<style>
/* ==========================================================================
   Tokens
   ========================================================================== */
:root {
  --ink: #111111;
  --cream: #EADDCA;
  --red: #C7352A;

  --surface: #181818;
  --surface-2: #202020;
  --line: rgba(234, 221, 202, 0.14);
  --line-strong: rgba(234, 221, 202, 0.32);
  --dim: rgba(234, 221, 202, 0.52);
  --faint: rgba(234, 221, 202, 0.30);
  --wash: rgba(234, 221, 202, 0.07);
  --red-wash: rgba(199, 53, 42, 0.14);

  --sans: 'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  --radius: 3px;
  --radius-sm: 2px;
}

/* ==========================================================================
   Base
   ========================================================================== */
html, body {
  margin: 0;
  padding: 0;
  background: var(--ink);
  overscroll-behavior: none;
}
html { scrollbar-gutter: stable; }
body { -webkit-text-size-adjust: 100%; }
/* Pins the page while a sheet is open. `position: fixed` is the only lock iOS
   honours; the script remembers the offset and hands it back on close. */
body.locked {
  position: fixed;
  left: 0;
  right: 0;
  width: 100%;
  overflow: hidden;
}
* { box-sizing: border-box; }

.app {
  font-family: var(--sans);
  background: var(--ink);
  color: var(--cream);
  min-height: 100vh;
  min-height: 100dvh;
  max-width: 520px;
  margin: 0 auto;
  /* viewport-fit=cover puts the page under the status bar and the home indicator,
     so every edge has to buy its way back out of the inset. */
  padding: calc(18px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
           calc(40px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  -webkit-tap-highlight-color: transparent;
}
/* Wrapped in :where() so this reset carries no specificity — otherwise `.app button`
   would outrank single-class rules like `.chip` and strip their surfaces. */
:where(.app button) {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
  color: inherit;
}
h1, h2 { margin: 0; font-weight: 800; letter-spacing: -0.03em; }
p { margin: 0; }
a { color: inherit; }

/* Shared type roles ------------------------------------------------------- */
.ar { color: var(--dim); font-size: 15px; }
.hint { color: var(--dim); font-size: 12px; line-height: 1.55; margin: 0 0 16px; }
.label {
  color: var(--dim);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.16em;
  margin: 24px 0 10px;
}
.num-text { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.label.first { margin-top: 4px; }
.label-row { display: flex; justify-content: space-between; align-items: center; margin: 24px 0 10px; }
.label-row .label { margin: 0; }

/* ==========================================================================
   Controls
   ========================================================================== */
.field {
  width: 100%;
  padding: 14px 16px;
  font: inherit;
  font-size: 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  color: var(--cream);
}
.field:focus { outline: 2px solid var(--cream); outline-offset: -1px; }
.field::placeholder { color: var(--faint); }

.picker { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.picker.tight { gap: 6px; }

.chip {
  padding: 13px 8px;
  border-radius: var(--radius);
  background: var(--surface-2);
  border: 1px solid var(--line);
  font-size: 14px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.chip.on { background: var(--cream); border-color: var(--cream); color: var(--ink); }
.chip:disabled { opacity: 0.28; }

.mode {
  text-align: left;
  padding: 14px 16px;

  width: 100%;
  margin-top: 20px;
  padding: 16px;
  border-radius: var(--radius);

.danger {

  letter-spacing: 0.06em;
  font-size: 13px;
}
.danger.wide { width: 100%; }
.danger.armed { background: var(--red); border-color: var(--red); color: var(--cream); }

.ghost {
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  background: transparent;
  border: 1px solid var(--line-strong);
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--dim);
}
.ghost.armed { background: var(--red-wash); border-color: var(--red); color: var(--red); }

.toggle {
  width: 100%;
  margin-top: 8px;
  padding: 12px;
  border-radius: var(--radius);
  background: var(--surface-2);
  border: 1px solid var(--line);
  font-size: 13px;
  font-weight: 600;
  color: var(--dim);
}

/* ==========================================================================
   Past games
   ========================================================================== */
.past {
  width: 100%;
  text-align: left;
  padding: 13px 14px;
  border-radius: var(--radius);
  background: var(--surface);

  display: flex;
  flex-direction: column;
  gap: 5px;
}
.past.on { background: var(--wash); border-color: var(--cream); }
.past-line { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.past-who {
  font-size: 15px;
  font-weight: 700;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.past-score {
  flex: none;
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-size: 14px;
  font-weight: 700;
  color: var(--dim);
}
.past-score.down { color: var(--red); }
.past-meta { font-size: 11px; color: var(--dim); line-height: 1.45; }

/* ==========================================================================
   Setup screen
   ========================================================================== */
.brand { text-align: center; margin: 32px 0 24px; }
.brand h1 { font-size: 52px; line-height: 0.95; text-transform: uppercase; }
.brand .rule {
  width: 44px;
  height: 3px;
  background: var(--red);
  margin: 14px auto 12px;
}

/* ==========================================================================
   Board — header and scoreboard
   ========================================================================== */
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.top h1 { font-size: 28px; text-transform: uppercase; }
.eyebrow {
  color: var(--red);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  margin-top: 5px;
}

.scores {
  margin-top: 18px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}
.row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--line);
}
.row:last-child { border-bottom: none; }
.row.winner { background: var(--wash); box-shadow: inset 3px 0 0 var(--cream); }
.place-badge {
  flex: none;
  width: 30px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--faint);
}
.place-badge.lead { color: var(--cream); }
/* Once the game is over the placing carries the whole answer to "who won", so it
   stops being a whisper in the margin and becomes a numbered chip. */
.row.final .place-badge {
  width: 26px;
  height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--line-strong);
  border-radius: 50%;
  font-size: 10px;
  font-weight: 700;
  color: var(--dim);
}
.row.winner .place-badge { background: var(--cream); border-color: var(--cream); color: var(--ink); }

.who { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; }
.name {
  font-size: 16px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.tag {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink);
  background: var(--cream);
  border-radius: var(--radius-sm);
  padding: 3px 6px;
  flex: none;
}
.delta { font-family: var(--mono); font-size: 12px; color: var(--dim); }
.delta.up { color: rgba(234, 221, 202, 0.85); }
.delta.down { color: rgba(199, 53, 42, 0.85); }
.total {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-size: 21px;
  font-weight: 700;
  min-width: 74px;
  text-align: right;
}
.total.down { color: var(--red); }

.warn {
  margin-top: 10px;
  padding: 11px 14px;
  border-radius: var(--radius);
  background: var(--red-wash);
  border-left: 3px solid var(--red);
  color: var(--red);
  font-size: 13px;
}

/* ==========================================================================
   Board — the final result
   ========================================================================== */
.result {
  margin-top: 18px;
  padding: 22px 18px 20px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  background: var(--wash);

}
.result-label {
  color: var(--red);
  font-size: 11px;
  font-weight: 700;

}
.result-name {
  margin-top: 8px;
  font-size: 34px;
  line-height: 1.02;
  font-weight: 800;
  letter-spacing: -0.03em;
  text-transform: uppercase;

}
.result-score {
  margin-top: 8px;
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-size: 14px;
  font-weight: 700;
  color: var(--dim);
}

/* ==========================================================================
   Board — contract tiles and the kingdom grid
   ========================================================================== */
.tiles { display: grid; gap: 8px; }
.tile {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px 6px 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.tile:active { background: var(--surface-2); border-color: var(--line-strong); }
.glyph { font-size: 28px; font-weight: 800; line-height: 1; }
.tile.red .glyph { color: var(--red); }
.tile-name { font-size: 14px; font-weight: 600; }
.tile-cost { font-family: var(--mono); font-size: 11px; color: var(--dim); }

.grid { display: flex; flex-direction: column; gap: 6px; }
.grid-row { display: flex; align-items: center; gap: 10px; }
.grid-name {
  flex: 1;
  font-size: 13px;
  color: var(--dim);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.cells { display: flex; gap: 6px; flex: none; }
.cell {
  width: 38px;
  height: 38px;
  border-radius: var(--radius-sm);
  background: var(--surface);
  border: 1px solid var(--line);
  font-size: 15px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.cell.wide { width: 96px; }
.cell-name { font-size: 12px; font-weight: 600; color: var(--dim); }
.cell.red { color: var(--red); }
.cell.empty { background: transparent; border-style: dashed; opacity: 0.4; }
.cell.next {
  border-color: var(--cream);
  border-style: solid;
  opacity: 1;
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 50% { border-color: var(--line); } }

/* ==========================================================================
   Hand sheet
   ========================================================================== */
/* The wrap is pinned to the *dynamic* viewport so the sheet can never grow taller
   than what the phone is actually showing. `vh` measures the tall viewport with the
   URL bar hidden, which used to push the header — and its close button — off the top
   of the screen with no way to scroll back to it. */
.sheet-wrap {
  position: fixed;
  inset: 0;
  height: 100vh;
  height: 100dvh;
  background: rgba(8, 8, 8, 0.78);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-top: calc(12px + env(safe-area-inset-top));
  overscroll-behavior: contain;
  z-index: 50;
}
.sheet {
  width: 100%;
  max-width: 520px;
  max-height: 100%;
  min-height: 0;
  display: flex;
  flex-direction: column;
  background: var(--ink);
  border: 1px solid var(--line-strong);
  border-bottom: none;
  border-radius: var(--radius) var(--radius) 0 0;
  padding: 0 max(16px, env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom))
           max(16px, env(safe-area-inset-left));
  animation: rise 0.22s ease-out;
}
@keyframes rise { from { transform: translateY(24px); } }
/* Handle and header together are the drag-to-dismiss target, so the browser must
   not claim the vertical gesture for scrolling first. */
.sheet-grab { flex: none; padding-top: 8px; touch-action: none; }
.handle { width: 38px; height: 4px; border-radius: 2px; background: var(--line-strong); margin: 0 auto 12px; }
.sheet-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line);
}
.sheet-head .ghost { flex: none; }
.sheet-head h2 { font-size: 20px; display: flex; align-items: center; gap: 8px; text-transform: uppercase; }
.sheet-glyph { font-size: 22px; }
.sheet-head h2.red .sheet-glyph { color: var(--red); }
.sheet-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding: 16px 0;
}
.sheet-foot { flex: none; border-top: 1px solid var(--line); padding-top: 12px; }
.needed { font-size: 12px; color: var(--dim); text-align: center; margin-bottom: 10px; }
.needed b { color: var(--cream); font-weight: 600; }

.block {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
}
.block.filled { border-color: var(--line-strong); }
.block-label {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 12px;
}
.block-label .red { color: var(--red); }
.block-meta { flex: none; display: flex; align-items: center; gap: 8px; }
.note { font-family: var(--mono); font-size: 11px; color: var(--dim); }
.sublabel { font-size: 12px; color: var(--dim); margin: 12px 0 8px; }
.nested { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }

.double {
  padding: 6px 10px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: var(--surface-2);
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 700;
  color: var(--dim);
}
.double.on { background: var(--red); border-color: var(--red); color: var(--cream); }

.counter { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.counter-name { flex: 1; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.step {
  width: 46px;
  height: 46px;
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  border: 1px solid var(--line);
  font-size: 20px;
  font-weight: 700;
}
.step:active { background: var(--cream); color: var(--ink); }
.count {
  width: 52px;
  height: 46px;
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  border: 1px solid var(--line);
  font-family: var(--mono);
  font-size: 17px;
  font-weight: 700;
}
.remaining { font-family: var(--mono); font-size: 12px; color: var(--red); }
.remaining.done { color: var(--cream); }

.ranks { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.rank {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  border: 1px solid var(--line);
  opacity: 0.5;
}
.rank.on { opacity: 1; border-color: var(--line-strong); }
.rank.lead { border-color: var(--cream); background: var(--wash); }
.place { flex: none; width: 28px; font-family: var(--mono); font-size: 12px; color: var(--dim); }
.rank-name {
  flex: 1;
  font-size: 14px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.points { font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.points.down { color: var(--red); }

/* The finished ranking, laid across rather than down: four stacked rows cost about
   215px before the ledger even starts, which is what pushed a finished game past one
   screen. Across, it costs about 76px and lines up with the ledger column for column,
   since that is ordered by rank too — so ranking and every hand fit one screenshot. */
/* A finished scorecard is one artefact — the ranking and every hand, meant to be
   caught in a single screenshot. It drops its section labels (the place chips and the
   Total row say what these are), tightens its rows, and, if it is still a little
   taller than the sheet, scales down instead of scrolling. See fitScorecard(). */
.sheet-body.fitted { padding: 0; }
.fit { overflow: hidden; }
.fit-inner {
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding: 16px 0;
  transform-origin: top left;
}
.ledger.final th, .ledger.final td { padding: 6px 3px; }
.ledger.final .ledger-kingdom td { padding: 16px 0 5px; }
.ledger.final tfoot th, .ledger.final tfoot td { padding-top: 11px; }

.podium { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.podium-seat {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  min-width: 0;
  padding: 12px 4px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
}
.podium-seat.lead { background: var(--wash); border-color: var(--cream); }
.podium-place {
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--dim);
  padding: 2px 6px;
}
.podium-seat.lead .podium-place {
  background: var(--cream);
  color: var(--ink);
  border-radius: 999px;
}
.podium-name {
  max-width: 100%;
  font-size: 12px;
  font-weight: 600;
  color: var(--dim);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.podium-score {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-size: 14px;
  font-weight: 700;
  color: var(--dim);
}
/* First place carries the result, so it is the one thing in the card that is loud. */
.podium-seat.lead .podium-name { font-size: 14px; font-weight: 800; color: var(--cream); }
.podium-seat.lead .podium-score { font-size: 18px; color: var(--cream); }
.podium-score.down,
.podium-seat.lead .podium-score.down { color: var(--red); }

.conflict {
  margin-top: 12px;
  padding: 12px 14px;
  border-radius: var(--radius);
  background: var(--red-wash);
  border-left: 3px solid var(--red);
}
.conflict p { color: var(--red); font-size: 12.5px; line-height: 1.55; }

.preview { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
.preview > div {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 8px 2px;
  background: var(--surface);
  border-radius: var(--radius-sm);
}
.preview-name {
  font-size: 10px;
  color: var(--dim);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 100%;
}
.preview-value { font-family: var(--mono); font-size: 14px; font-weight: 700; color: var(--dim); }
.preview-value.up { color: var(--cream); }
.preview-value.down { color: var(--red); }
.sheet-actions { display: flex; gap: 8px; }
.sheet-actions + .sheet-actions { margin-top: 8px; }
.sheet-actions .primary { margin-top: 0; }

.secondary {
  flex: none;
  padding: 16px 18px;
  border-radius: var(--radius);
  background: var(--surface-2);
  border: 1px solid var(--line-strong);
  color: var(--cream);
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

/* ==========================================================================
   Scorecard ledger
   ========================================================================== */
.sheet-sub { color: var(--dim); font-size: 13px; margin-top: 3px; }

.ledger-wrap { overflow-x: auto; }
.ledger {
  width: 100%;
  min-width: 340px;
  table-layout: fixed;
  border-collapse: collapse;
}
.ledger th, .ledger td { padding: 5px 3px; text-align: right; }
.ledger thead th {
  font-size: 10px;
  font-weight: 700;
  color: var(--dim);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--line);
}
/* Only the column's head and its total are tinted: banding the body as well broke the
   tint across every kingdom heading and read as stripes rather than as one column. */
.ledger .lead { background: var(--wash); }
.ledger-contract, .ledger thead td, .ledger tfoot th { width: 32%; text-align: left; }
.ledger-contract {
  font-size: 12px;
  font-weight: 600;
  color: var(--dim);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ledger-value {
  font-family: var(--mono);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  color: var(--faint);
}
.ledger-value.up { color: var(--cream); }
.ledger-value.down { color: var(--red); }
/* Most cells in a finished card are zeros. They have to be there for the columns to
   add up, but they carry nothing, so they recede almost to the paper and let the
   scores that did happen carry the table. */
.ledger-value.zero { color: rgba(234, 221, 202, 0.15); }
.ledger tbody .ledger-kingdom:not(:first-child) td { border-top: 1px solid var(--line); }
.ledger-kingdom td {
  padding: 11px 0 3px;
  text-align: left;
  font-size: 10px;
  font-weight: 700;
  color: var(--dim);
  text-transform: uppercase;
  letter-spacing: 0.14em;
}
.ledger tfoot tr { border-top: 1px solid var(--line-strong); }
.ledger tfoot th {
  font-size: 10px;
  font-weight: 700;
  color: var(--dim);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}
.ledger tfoot th, .ledger tfoot td { padding-top: 9px; }
.ledger tfoot .ledger-value { font-size: 15px; font-weight: 700; color: var(--cream); }
.ledger tfoot .ledger-value.down { color: var(--red); }

/* ==========================================================================
   Toast
   ========================================================================== */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(28px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  z-index: 60;
  background: var(--cream);
  color: var(--ink);
  padding: 11px 18px;
  border-radius: var(--radius);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  white-space: nowrap;
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.55);
  animation: rise 0.18s ease-out;
}

/* ==========================================================================
   Colophon
   ========================================================================== */
.colophon {
  margin-top: 36px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: center;
  gap: 6px;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--faint);
}
.colophon a { color: var(--dim); text-decoration: none; border-bottom: 1px solid var(--line-strong); }
.colophon a:hover { color: var(--cream); border-bottom-color: var(--cream); }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
}

<div id="root"></div>
<script>
(() => {
  'use strict';

  /* ========================================================================
     Game rules
     ====================================================================== */

  // Every contract a kingdom can contain, with its Arabic name and its cost.
  // `total` is what the whole table nets on that contract once the hand is complete —
  // doubling only moves points between players, so it never changes the total.
  const CONTRACTS = {
    complex:      { name: 'Complex',        ar: 'كومبلكس', glyph: '✦',  cost: '−500',     total: -500 },
    kingOfHearts: { name: 'King of Hearts', ar: 'شيخ كوبة', glyph: 'K♥', cost: '−75',      total: -75,  red: true },
    diamonds:     { name: 'Diamonds',       ar: 'ديناري',  glyph: '♦',  cost: '−10 each', total: -130, red: true },
    queens:       { name: 'Queens',         ar: 'بنات',    glyph: 'Q',  cost: '−25 each', total: -100 },
    collection:   { name: 'Tricks',         ar: 'لطوشة',   glyph: '≡',  cost: '−15 each', total: -195 },
    trix:         { name: 'Trix',           ar: 'تركس',   glyph: 'J',  cost: '+500',     total: 500 },
  };

  // The two ways a kingdom gets dealt out.
  const MODES = {
    complex: {
      label: 'Complex',
      blurb: 'All four losing games in one hand, then Trix. Two hands per kingdom.',
      contracts: ['complex', 'trix'],
    },
    classic: {
      label: 'Classic',
      blurb: 'Each losing game dealt separately. Five hands per kingdom.',
      contracts: ['kingOfHearts', 'diamonds', 'queens', 'collection', 'trix'],
    },
  };

  const SUITS = ['♠', '♥', '♦', '♣'];
  const TRIX_POINTS = [200, 150, 100, 50];   // 1st through 4th out
  const TRICKS_PER_HAND = 13;
  const PLAYERS = 4;
  const KINGDOMS = 4;
  const PLACES = ['1st', '2nd', '3rd', '4th'];

  const sum = (list) => list.reduce((a, b) => a + b, 0);

  /* ========================================================================
     Storage
     ====================================================================== */

  const STORAGE_KEY = 'trix:game:v2';
  const ARCHIVE_KEY = 'trix:archive:v1';
  const ARCHIVE_LIMIT = 20;      // enough to cover a season; the oldest falls off the end
  const PAST_SHOWN = 5;          // the rest of the archive is one tap away

  const newId = () => `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;

  const storage = {
    load() {
      try {
        const game = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (!game) return null;
        // A game saved before the archive existed has no id. Give it one so that it
        // can be filed like any other rather than sitting outside history forever.
        return game.id ? game : { ...game, id: newId() };
      } catch {
        return null;
      }
    },
    loadArchive() {
      try {
        const list = JSON.parse(localStorage.getItem(ARCHIVE_KEY));
        return Array.isArray(list) ? list : [];
      } catch {
        return [];
      }
    },
    saveArchive(list) {
      try {
        localStorage.setItem(ARCHIVE_KEY, JSON.stringify(list));
      } catch {
        /* private mode / quota — see save() */
      }
    },
    save(game) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(game));
      } catch {
        /* private mode / quota — the game still plays, it just won't survive a reload */
      }
    },
    clear() {
      try {
        localStorage.removeItem(STORAGE_KEY);
      } catch {}
    },
  };

  /* ========================================================================
     Hand data
     ====================================================================== */

  // A "taker" records who won a single penalty card, plus any doubling around it.
  const takerEntry = (suit) => ({
    suit,
    taker: null,
    doubled: false,
    doubledBy: null,
    selfLed: false,
    leader: null,
  });

  const queenSet = () => SUITS.map(takerEntry);
  const zeroes = () => new Array(PLAYERS).fill(0);

  function blankHandData(contract) {
    switch (contract) {
      case 'complex':
        return { tricks: zeroes(), king: takerEntry('♥'), queens: queenSet(), diamonds: zeroes() };
      case 'kingOfHearts': return { king: takerEntry('♥') };
      case 'diamonds':     return { diamonds: zeroes() };
      case 'queens':       return { queens: queenSet() };
      case 'collection':   return { tricks: zeroes() };
      case 'trix':         return { order: [] };
      default:             return {};
    }
  }

  // A taker is settled once we know who took it and — if doubled — how the double resolves.
  const takerSettled = (entry) =>
    entry.taker != null &&
    (!entry.doubled ||
      (entry.doubledBy != null &&
        (entry.taker !== entry.doubledBy || entry.selfLed || entry.leader != null)));

  function handIsComplete(contract, data) {
    switch (contract) {
      case 'complex':
        return sum(data.tricks) === TRICKS_PER_HAND &&
          sum(data.diamonds) === TRICKS_PER_HAND &&
          takerSettled(data.king) &&
          data.queens.every(takerSettled);
      case 'kingOfHearts': return takerSettled(data.king);
      case 'diamonds':     return sum(data.diamonds) === TRICKS_PER_HAND;
      case 'queens':       return data.queens.every(takerSettled);
      case 'collection':   return sum(data.tricks) === TRICKS_PER_HAND;
      case 'trix':         return data.order.length === PLAYERS;
      default:             return false;
    }
  }

  // What is still stopping a hand from saving, named in the order the blocks appear.
  function missingParts(data) {
    const parts = [];
    if (data.tricks && sum(data.tricks) !== TRICKS_PER_HAND) parts.push('tricks');
    if (data.king && !takerSettled(data.king)) parts.push('K♥');
    if (data.queens) {
      data.queens.forEach((queen) => { if (!takerSettled(queen)) parts.push(`Q${queen.suit}`); });
    }
    if (data.diamonds && sum(data.diamonds) !== TRICKS_PER_HAND) parts.push('diamonds');
    if (data.order && data.order.length !== PLAYERS) {
      const left = PLAYERS - data.order.length;
      parts.push(`${left} more player${left === 1 ? '' : 's'} to go out`);
    }
    return parts;
  }

  /* ========================================================================
     Scoring
     ====================================================================== */

  // Charge one penalty card, honouring whoever doubled it.
  //   - doubled by someone else       → taker pays double, the doubler collects
  //   - doubled by the taker, self-led → taker pays single
  //   - doubled by the taker otherwise → taker pays double, the trick's leader collects
  function chargeTaker(scores, entry, amount) {
    if (!entry.doubled || entry.doubledBy == null) {
      scores[entry.taker] -= amount;
      return;
    }
    const by = entry.doubledBy;
    if (entry.taker !== by) {
      scores[entry.taker] -= amount * 2;
      scores[by] += amount;
    } else if (entry.selfLed) {
      scores[by] -= amount;
    } else {
      scores[by] -= amount * 2;
      if (entry.leader != null) scores[entry.leader] += amount;
    }
  }

  const chargeCounts = (scores, counts, perCard) =>
    counts.forEach((n, i) => { scores[i] -= n * perCard; });

  function scoreHand(hand) {
    const scores = zeroes();
    const d = hand.data;
    switch (hand.contract) {
      case 'complex':
        chargeTaker(scores, d.king, 75);
        d.queens.forEach((q) => chargeTaker(scores, q, 25));
        chargeCounts(scores, d.diamonds, 10);
        chargeCounts(scores, d.tricks, 15);
        break;
      case 'kingOfHearts': chargeTaker(scores, d.king, 75); break;
      case 'diamonds':     chargeCounts(scores, d.diamonds, 10); break;
      case 'queens':       d.queens.forEach((q) => chargeTaker(scores, q, 25)); break;
      case 'collection':   chargeCounts(scores, d.tricks, 15); break;
      case 'trix':         d.order.forEach((player, place) => { scores[player] += TRIX_POINTS[place]; }); break;
    }
    return scores;
  }

  const runningTotals = (hands) => {
    const totals = zeroes();
    hands.forEach((hand) => scoreHand(hand).forEach((points, i) => { totals[i] += points; }));
    return totals;
  };

  // Players ordered best-first. Ties share a place and consume the ones below it,
  // so two players level at the top are both 1st and the next is 3rd.
  function standings(totals) {
    const ordered = totals
      .map((points, player) => ({ player, points }))
      .sort((a, b) => b.points - a.points);

    let place = 1;
    return ordered.map((entry, i) => {
      if (i > 0 && entry.points < ordered[i - 1].points) place = i + 1;
      return { ...entry, place };
    });
  }

  // "Ann", "Ann & Bo", "Ann, Bo & Cy"
  const joinNames = (list) =>
    list.length < 2 ? (list[0] || '') : `${list.slice(0, -1).join(', ')} & ${list[list.length - 1]}`;

  // Who is on top — worked out once so the board, the scorecard and the shared
  // text can never disagree about who won.
  function outcomeOf(names, totals) {
    const ranked = standings(totals);
    const leaders = ranked.filter((entry) => entry.place === 1);
    const who = joinNames(leaders.map((entry) => names[entry.player]));
    return {
      ranked,
      who,
      tied: leaders.length > 1,
      points: leaders.length ? leaders[0].points : 0,
      text: leaders.length > 1 ? `${who} tie` : `${who} wins`,
    };
  }

  // In a Complex hand every penalty card lives inside a trick someone took, so a
  // player holding more penalties than their tricks could hold means a miscount.
  function complexConflicts(data, names) {
    // Until the tricks are all accounted for there is nothing to measure against.
    if (sum(data.tricks) !== TRICKS_PER_HAND) return [];

    const notes = [];
    const queensTaken = zeroes();
    data.queens.forEach((q) => { if (q.taker != null) queensTaken[q.taker]++; });

    names.forEach((name, i) => {
      const capacity = data.tricks[i] * 4;   // four cards to a trick
      if (data.diamonds[i] > capacity) {
        notes.push(`${name} took ${data.diamonds[i]} diamonds but only ${data.tricks[i]} tricks.`);
      }
      if (queensTaken[i] > capacity) {
        notes.push(`${name} took ${queensTaken[i]} queens but only ${data.tricks[i]} tricks.`);
      }
      if (data.king.taker === i && data.tricks[i] === 0) {
        notes.push(`${name} took the K♥ but no tricks.`);
      }
    });
    return notes;
  }

  /* ========================================================================
     DOM helper
     ====================================================================== */

  // el('button', { class: 'chip', onClick: fn }, 'label')
  // Nested arrays are flattened; null / false / undefined children are dropped.
  function el(tag, props, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(props || {})) {
      if (value == null || value === false) continue;
      if (key === 'class') node.className = value;
      else if (key === 'style') Object.assign(node.style, value);
      else if (key.startsWith('on')) node.addEventListener(key.slice(2).toLowerCase(), value);
      else if (key in node) node[key] = value;
      else node.setAttribute(key, value);
    }
    appendChildren(node, children);
    return node;
  }

  function appendChildren(node, children) {
    for (const child of children) {
      if (child == null || child === false || child === true) continue;
      if (Array.isArray(child)) appendChildren(node, child);
      else node.append(child instanceof Node ? child : String(child));
    }
  }

  const classes = (...names) => names.filter(Boolean).join(' ');
  const signed = (n) => (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(n);

  // When a game was played. `endedAt` is what the first version of the archive
  // wrote, so keep reading it.
  const gameDate = (game) => game.startedAt || game.playedAt || game.endedAt;

  // "28 Aug" for a game from this year, "28 Aug 2025" for anything older.
  function shortDate(stamp) {
    if (!stamp) return '';
    const date = new Date(stamp);
    const parts = { day: 'numeric', month: 'short' };
    if (date.getFullYear() !== new Date().getFullYear()) parts.year = 'numeric';
    return date.toLocaleDateString(undefined, parts);
  }

  /* ========================================================================
     State
     ====================================================================== */

  const root = document.getElementById('root');

  const blankSetup = () => ({ names: ['', '', '', ''], startIdx: null, mode: 'complex' });

  const state = {
    game: storage.load(),            // null until a game is set up
    archive: storage.loadArchive(),  // games already played, newest first
    sheet: null,                     // { contract, index } while a hand is open
    history: null,                   // { gameId } while a scorecard is open; null id = the game in play
    setup: blankSetup(),             // the setup form, discarded once a game starts
    draft: null,                     // the hand being edited in the sheet
    toast: null,                     // transient confirmation message
    confirmReset: false,             // true once "New game" has been armed but not confirmed
    confirmDelete: null,             // id of the past game whose delete has been armed
    showAllPast: false,              // true once the past games list has been expanded
  };

  // A half-pressed destructive button must never lie in wait for the next tap, so
  // anything other than arming one of these puts them all back.
  const DISARMED = { confirmReset: false, confirmDelete: null };

  function setState(changes) {
    const disarm = {};
    for (const [armed, off] of Object.entries(DISARMED)) {
      if (!(armed in changes)) disarm[armed] = off;
    }
    Object.assign(state, changes, disarm);
    if (state.game) storage.save(state.game);
    if ('archive' in changes) storage.saveArchive(state.archive);
    render();
  }

  const MIN_SCORECARD_SCALE = 0.75;

  // Shrink a finished scorecard just enough that ranking and every hand land in one
  // screenshot. Only a little: past MIN_SCORECARD_SCALE an unreadable card is worse
  // than a scrolled one, so it is left to scroll from there.
  function fitScorecard() {
    const inner = root.querySelector('.fit-inner');
    if (!inner) return;
    const frame = inner.parentElement;
    const body = frame.parentElement;

    // Measure unscaled, or every pass would compound the last one's scale.
    inner.style.transform = 'none';
    inner.style.width = '100%';
    frame.style.height = 'auto';

    const need = inner.getBoundingClientRect().height;
    const have = body.clientHeight;
    if (!need || !have || need <= have) return;

    // Scaling shrinks the card's width along with its height, which would leave it
    // visibly narrower than the sheet's own header and footer. Widening it by the same
    // factor first lands it back at full width — and the extra room means rows wrap
    // less, so it is measured again at that width before the scale is settled.
    const widen = (k) => { inner.style.width = `${100 / k}%`; };
    widen(Math.max(MIN_SCORECARD_SCALE, have / need));

    const wide = inner.getBoundingClientRect().height;
    const scale = Math.max(MIN_SCORECARD_SCALE, Math.min(1, have / wide));
    widen(scale);
    inner.style.transform = `scale(${scale})`;
    frame.style.height = `${Math.ceil(inner.getBoundingClientRect().height)}px`;
  }

  // The webfonts land after the first paint and change every row height with them,
  // so the card is measured again once they are in.
  if (document.fonts) document.fonts.ready.then(fitScorecard);
  window.addEventListener('resize', fitScorecard);

  // The whole screen is cheap enough to rebuild on every change, but throwing the DOM
  // away also throws away the things the browser was holding for us: the caret in a
  // text field, and how far the page and the open sheet were scrolled. Carry them over.
  // A sheet covers the screen, so the page behind it must not move underneath it —
  // that drift is what makes a sheet feel unmoored on a phone. `position: fixed` is
  // the only lock iOS honours, and it forgets where you were, so remember it here.
  let lockedAt = 0;
  let scrollLocked = false;

  function setScrollLock(next) {
    if (next === scrollLocked) return;
    scrollLocked = next;
    if (next) {
      lockedAt = window.scrollY;
      document.body.style.top = `-${lockedAt}px`;
      document.body.classList.add('locked');
    } else {
      document.body.classList.remove('locked');
      document.body.style.top = '';
      window.scrollTo(0, lockedAt);
    }
  }

  function render() {
    const active = document.activeElement;
    const focusKey = active && active.dataset ? active.dataset.focusKey : null;
    const caret = focusKey && 'selectionStart' in active ? active.selectionStart : null;
    const pageScroll = scrollLocked ? lockedAt : window.scrollY;
    const sheetBody = root.querySelector('.sheet-body');
    const sheetScroll = sheetBody ? sheetBody.scrollTop : 0;

    // The sheet lives inside .app — that is where the colour, font and button reset are
    // inherited from. It still covers the screen, because .sheet-wrap is position:fixed.
    root.replaceChildren(el('div', { class: 'app' },
      state.game ? Board() : Setup(),
      Colophon(),
      state.sheet ? Sheet() : state.history ? HistorySheet() : null,
      state.toast ? el('p', { class: 'toast' }, state.toast) : null,
    ));

    setScrollLock(Boolean(state.sheet || state.history));
    if (!scrollLocked) window.scrollTo(0, pageScroll);

    const nextSheetBody = root.querySelector('.sheet-body');
    if (nextSheetBody) nextSheetBody.scrollTop = sheetScroll;
    fitScorecard();

    if (focusKey) {
      const next = root.querySelector(`[data-focus-key="${focusKey}"]`);
      if (next) {
        next.focus();
        if (caret != null) next.setSelectionRange(caret, caret);
      }
    }
  }

  /* ========================================================================
     Actions
     ====================================================================== */

  function startGame() {
    const { names, startIdx, mode } = state.setup;
    setState({
      game: {
        id: newId(),
        names: displayNames(names),
        startIdx,
        mode,
        hands: [],
        startedAt: Date.now(),
      },
    });
  }

  // History mirrors every game that has had a hand played — the one on the board
  // included — so it is never waiting on you to clear the board before a game shows
  // up in it. Filing is an upsert on the game's id, so a game can be filed after every
  // single hand and still never appear twice. Undo back to nothing un-files it again.
  function fileGame(game, archive) {
    const rest = archive.filter((filed) => !game || filed.id !== game.id);
    if (!game || !game.hands.length) return rest;
    return [{ ...game, playedAt: Date.now() }, ...rest].slice(0, ARCHIVE_LIMIT);
  }

  function resetGame() {
    const archive = fileGame(state.game, state.archive);
    storage.clear();
    setState({ game: null, archive, sheet: null, history: null, draft: null, setup: blankSetup() });
  }

  // Put an unfinished game back on the board. Whatever is on the board right now is
  // filed by the same rule as New game, so resuming never quietly drops a game in play.
  function resumeGame(entry) {
    const displaced = Boolean(state.game && state.game.hands.length);

    setState({
      game: { ...entry },
      // The game coming off the board is filed on its way out; the one going on is
      // already on file, and drops out of the list because it is live again.
      archive: fileGame(state.game, state.archive),
      sheet: null,
      history: null,
      draft: null,
    });

    if (displaced) flash('Previous game saved');
  }

  function deleteArchived(id) {
    setState({
      archive: state.archive.filter((entry) => entry.id !== id),
      // The sheet was showing that game, so send it somewhere that still exists.
      history: state.game ? { gameId: null } : null,
    });
  }

  // Edits happen on a copy, so closing the sheet without saving changes nothing.
  // The data round-trips through localStorage as JSON anyway, so JSON is a faithful clone.
  const cloneData = (data) => JSON.parse(JSON.stringify(data));

  function openHand(contract, index) {
    const existing = index != null ? state.game.hands[index] : null;
    setState({
      sheet: { contract, index },
      draft: existing ? cloneData(existing.data) : blankHandData(contract),
    });
  }

  function saveHand() {
    const { contract, index } = state.sheet;
    const hands = [...state.game.hands];
    const hand = { contract, data: state.draft };
    if (index == null) hands.push(hand);
    else hands[index] = hand;
    const game = { ...state.game, hands };
    setState({ game, archive: fileGame(game, state.archive), sheet: null, draft: null });
    // The point of saving is to see what it did to the totals, which live at the top.
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function deleteHand(index) {
    const hands = state.game.hands.filter((_, i) => i !== index);
    const game = { ...state.game, hands };
    setState({ game, archive: fileGame(game, state.archive), sheet: null, draft: null });
  }

  const closeSheet = () => setState({ sheet: null, draft: null });
  const updateDraft = (changes) => setState({ draft: { ...state.draft, ...changes } });

  const openHistory = (gameId = null) => setState({ history: { gameId }, sheet: null, draft: null });
  const closeHistory = () => setState({ history: null });

  document.addEventListener('keydown', (event) => {
    if (event.key !== 'Escape') return;
    if (state.sheet) closeSheet();
    else if (state.history) closeHistory();
  });

  // Drag the sheet's header downwards to dismiss it — the gesture every other bottom
  // sheet on a phone already answers to, so the Close button is never the only way out.
  function grabToDismiss(close) {
    return (event) => {
      if (event.pointerType === 'mouse') return;
      const sheet = event.currentTarget.closest('.sheet');
      if (!sheet) return;

      const startY = event.clientY;
      let offset = 0;

      const move = (e) => {
        offset = Math.max(0, e.clientY - startY);
        sheet.style.transition = 'none';
        sheet.style.transform = `translateY(${offset}px)`;
      };
      const end = () => {
        window.removeEventListener('pointermove', move);
        window.removeEventListener('pointerup', end);
        window.removeEventListener('pointercancel', end);
        if (offset > 80) { close(); return; }
        sheet.style.transition = 'transform 0.18s ease-out';
        sheet.style.transform = '';
      };

      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', end);
      window.addEventListener('pointercancel', end);
    };
  }

  const displayNames = (names) => names.map((n, i) => n.trim() || `Player ${i + 1}`);

  /* ========================================================================
     Sharing
     ====================================================================== */

  let toastTimer = null;

  function flash(message) {
    clearTimeout(toastTimer);
    setState({ toast: message });
    toastTimer = setTimeout(() => setState({ toast: null }), 2400);
  }

  // The scorecard as plain text, built to stay readable in a chat app where
  // nothing is aligned and no monospace font is guaranteed.
  function historyText(game) {
    const { names, startIdx, hands, mode } = game;
    const perKingdom = MODES[mode].contracts.length;
    const totals = runningTotals(hands);
    const finished = hands.length === perKingdom * KINGDOMS;

    const result = outcomeOf(names, totals);

    const lines = [`TRIX · ${MODES[mode].label}`];
    lines.push(finished
      ? `Final result — ${result.text}`
      : `After ${hands.length} hand${hands.length === 1 ? '' : 's'}`);
    const played = shortDate(gameDate(game));
    if (played) lines.push(played);
    lines.push('');

    result.ranked.forEach(({ player, points, place }) => {
      lines.push(`${PLACES[place - 1]}  ${names[player]}  ${signed(points)}`);
    });

    hands.forEach((hand, i) => {
      const kingdom = Math.floor(i / perKingdom);
      if (i % perKingdom === 0) {
        lines.push('');
        lines.push(`Kingdom ${kingdom + 1} — ${names[(startIdx + kingdom) % PLAYERS]}`);
      }
      const scores = scoreHand(hand);
      const detail = names.map((name, p) => `${name} ${signed(scores[p])}`).join(', ');
      lines.push(`  ${CONTRACTS[hand.contract].name}: ${detail}`);
    });

    return lines.join('\n');
  }

  // navigator.clipboard needs a secure context, which a file:// page is not.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise((resolve, reject) => {
      const area = document.createElement('textarea');
      area.value = text;
      area.setAttribute('readonly', '');
      area.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
      document.body.append(area);
      area.select();
      const copied = document.execCommand('copy');
      area.remove();
      copied ? resolve() : reject(new Error('copy rejected'));
    });
  }

  async function copyHistory(game) {
    try {
      await copyText(historyText(game));
      flash('Copied to clipboard');
    } catch {
      flash("Couldn't copy");
    }
  }

  async function shareHistory(game) {
    try {
      await navigator.share({ title: 'Trix scorecard', text: historyText(game) });
    } catch (err) {
      // Dismissing the share sheet is not a failure worth reporting.
      if (!err || err.name !== 'AbortError') copyHistory(game);
    }
  }

  /* ========================================================================
     Setup screen
     ====================================================================== */

  function Setup() {
    const { names, startIdx, mode } = state.setup;
    const shown = displayNames(names);

    return [
      el('header', { class: 'brand' },
        el('h1', null, 'Trix'),
        el('div', { class: 'rule' }),
        el('p', { class: 'ar' }, 'تركس'),
      ),
      el('p', { class: 'hint' }, 'Enter everyone in seating order, going right around the table.'),

      el('div', { class: 'stack' }, names.map((value, i) =>
        el('input', {
          class: 'field',
          value,
          placeholder: `Player ${i + 1}`,
          maxLength: 14,
          'data-focus-key': `name-${i}`,
          onInput: (e) => {
            const next = names.map((n, j) => (j === i ? e.target.value : n));
            setState({ setup: { ...state.setup, names: next } });
          },
        }),
      )),

      el('p', { class: 'label' }, 'Who was dealt the 7♥?'),
      el('div', { class: 'picker' }, shown.map((name, i) =>
        el('button', {
          class: classes('chip', startIdx === i && 'on'),
          onClick: () => setState({ setup: { ...state.setup, startIdx: i } }),
        }, name),
      )),

      el('p', { class: 'label' }, 'How are you playing?'),
      el('div', { class: 'stack' }, Object.entries(MODES).map(([key, def]) =>
        el('button', {
          class: classes('mode', mode === key && 'on'),
          onClick: () => setState({ setup: { ...state.setup, mode: key } }),
        },
          el('span', { class: 'mode-name' }, def.label),
          el('span', { class: 'mode-blurb' }, def.blurb),
        ),
      )),

      el('button', { class: 'primary', disabled: startIdx == null, onClick: startGame }, 'Start game'),

      PastGames(),
    ];
  }

  /* ========================================================================
     Past games
     ====================================================================== */

  // Every game that has had a hand played, most recent first, less the one on the
  // board — that one you are already looking at. Shown on the setup screen and at the
  // foot of the board. Deliberately not in the scorecard sheet: that sheet has to read
  // as one clean artefact when it is screenshotted.
  function PastGames() {
    // The scorecard sheet no longer carries this list, so the open game is marked
    // here instead — on the screen the sheet was opened from.
    const viewing = state.history && state.history.gameId;
    const list = state.archive.filter((game) => !state.game || game.id !== state.game.id);
    if (!list.length) return null;

    const shown = state.showAllPast ? list : list.slice(0, PAST_SHOWN);

    return [
      el('p', { class: 'label' }, 'Past games'),
      el('div', { class: 'stack' }, shown.map((game) => {
        const totals = runningTotals(game.hands);
        const result = outcomeOf(game.names, totals);
        const played = game.hands.length;
        const total = MODES[game.mode].contracts.length * KINGDOMS;
        const done = played === total;

        return el('button', {
          class: classes('past', viewing === game.id && 'on'),
          onClick: () => openHistory(game.id),
        },
          el('span', { class: 'past-line' },
            el('span', { class: 'past-who' },
              done ? result.text : `${result.who} lead${result.tied ? '' : 's'}`),
            el('span', { class: classes('past-score', result.points < 0 && 'down') },
              signed(result.points)),
          ),
          el('span', { class: 'past-meta' }, [
            shortDate(gameDate(game)),
            done ? MODES[game.mode].label : `${played} of ${total} hands`,
            joinNames(game.names),
          ].filter(Boolean).join(' · ')),
        );
      })),

      list.length > PAST_SHOWN && el('button', {
        class: 'toggle',
        onClick: () => setState({ showAllPast: !state.showAllPast }),
      }, state.showAllPast ? 'Show fewer' : `Show all ${list.length}`),
    ];
  }

  /* ========================================================================
     Board
     ====================================================================== */

  function Board() {
    const { names, startIdx, hands } = state.game;
    const contracts = MODES[state.game.mode].contracts;
    const perKingdom = contracts.length;

    const totals = runningTotals(hands);
    const lastHand = hands.length ? scoreHand(hands[hands.length - 1]) : null;

    const kingdom = Math.floor(hands.length / perKingdom);
    const finished = hands.length === perKingdom * KINGDOMS;
    const dealer = finished ? null : (startIdx + kingdom) % PLAYERS;

    const playedThisKingdom = hands.slice(kingdom * perKingdom).map((h) => h.contract);
    const remaining = contracts.filter((c) => !playedThisKingdom.includes(c));

    // Standings so far — shown from the first hand on, not just at the end.
    const result = outcomeOf(names, totals);
    const placeOf = zeroes();
    result.ranked.forEach(({ player, place }) => { placeOf[player] = place; });

    // Mid-game the list stays in seating order, because that is what tells you whose
    // kingdom comes next. Once it is over seating no longer matters and rank does.
    const seats = finished ? result.ranked.map((entry) => entry.player) : names.map((_, i) => i);

    // Hands only net to zero across a full kingdom (−500 of losing games, +500 of Trix),
    // so the running total is measured against what the hands played so far should net —
    // not against zero. Anything left over means a stored hand is malformed.
    const expected = sum(hands.map((hand) => CONTRACTS[hand.contract].total));
    const drift = sum(totals) - expected;

    return [
      el('header', { class: 'top' },
        el('div', null,
          el('h1', null, 'Trix'),
          el('p', { class: 'eyebrow' },
            finished ? 'Game over' : `Kingdom ${kingdom + 1} of ${KINGDOMS} · ${names[dealer]}`),
        ),
        el('div', { class: 'tools' },
          hands.length > 0 &&
            el('button', { class: 'ghost', onClick: () => deleteHand(hands.length - 1) }, 'Undo'),
          // Throwing a whole game away deserves a second tap, not a stray one.
          el('button', {
            class: classes('ghost', state.confirmReset && 'armed'),
            onClick: () => (state.confirmReset ? resetGame() : setState({ confirmReset: true })),
          }, state.confirmReset ? 'Sure?' : 'New game'),
        ),
      ),

      finished && el('section', { class: 'result' },
        el('p', { class: 'result-label' }, result.tied ? 'Tied' : 'Winner'),
        el('h2', { class: 'result-name' }, result.who),
        el('p', { class: 'result-score' }, `${signed(result.points)} points`),
        el('button', { class: 'primary', onClick: openHistory }, 'Full scorecard'),
      ),

      el('section', { class: 'scores' }, seats.map((i) =>
        el('div', {
          class: classes('row', finished && 'final', finished && placeOf[i] === 1 && 'winner'),
        },
          hands.length > 0 &&
            el('span', { class: classes('place-badge', placeOf[i] === 1 && 'lead') },
              PLACES[placeOf[i] - 1]),
          el('div', { class: 'who' },
            el('span', { class: 'name' }, names[i]),
            !finished && i === dealer && el('span', { class: 'tag' }, 'kingdom'),
          ),
          lastHand && lastHand[i] !== 0 &&
            el('span', { class: classes('delta', lastHand[i] > 0 ? 'up' : 'down') }, signed(lastHand[i])),
          el('span', { class: classes('total', totals[i] < 0 && 'down') }, signed(totals[i])),
        ),
      )),

      drift !== 0 &&
        el('p', { class: 'warn' }, `Scores are off by ${drift}. Tap a played hand below to fix it.`),

      !finished && el('section', null,
        el('p', { class: 'label' }, `${names[dealer]} deals`),
        el('div', {
          class: 'tiles',
          style: { gridTemplateColumns: `repeat(${Math.min(remaining.length, 3)}, 1fr)` },
        }, remaining.map((key) => {
          const contract = CONTRACTS[key];
          return el('button', {
            class: classes('tile', contract.red && 'red'),
            onClick: () => openHand(key, null),
          },
            el('span', { class: 'glyph' }, contract.glyph),
            el('span', { class: 'tile-name' }, contract.name),
            el('span', { class: 'tile-cost' }, contract.cost),
          );
        })),
      ),

      el('section', null,
        el('div', { class: 'label-row' },
          el('p', { class: 'label' }, 'The four kingdoms'),
          hands.length > 0 &&
            el('button', { class: 'ghost', onClick: openHistory }, 'History'),
        ),
        el('div', { class: 'grid' }, Array.from({ length: KINGDOMS }, (_, row) =>
          el('div', { class: 'grid-row' },
            el('span', { class: 'grid-name' }, names[(startIdx + row) % PLAYERS]),
            el('div', { class: 'cells' }, contracts.map((_, col) => {
              const index = row * perKingdom + col;
              const hand = hands[index];
              const wide = perKingdom <= 2 ? 'wide' : '';

              if (!hand) {
                return el('span', {
                  class: classes('cell', 'empty', wide, index === hands.length && 'next'),
                });
              }
              const contract = CONTRACTS[hand.contract];
              return el('button', {
                class: classes('cell', wide, contract.red && 'red'),
                onClick: () => openHand(hand.contract, index),
              },
                contract.glyph,
                wide && el('span', { class: 'cell-name' }, contract.name),
              );
            })),
          ),
        )),
      ),

      PastGames(),
    ];
  }

  /* ========================================================================
     Hand sheet
     ====================================================================== */

  function Sheet() {
    const { contract: key, index } = state.sheet;
    const contract = CONTRACTS[key];
    const data = state.draft;
    const { names } = state.game;

    const complete = handIsComplete(key, data);
    const missing = complete ? [] : missingParts(data);
    const preview = complete ? scoreHand({ contract: key, data }) : null;
    const conflicts = key === 'complex' ? complexConflicts(data, names) : [];

    const tricksBlock = () => CountBlock({
      names, counts: data.tricks, unit: 'tricks', note: '−15 each',
      onChange: (tricks) => updateDraft({ tricks }),
    });
    const kingBlock = () => TakerBlock({
      names, entry: data.king, label: 'Who took the K♥?', note: '−75', red: true,
      onChange: (king) => updateDraft({ king }),
    });
    const queenBlocks = () => data.queens.map((queen, i) => TakerBlock({
      names, entry: queen, label: `Who took the Q${queen.suit}?`, note: '−25',
      red: queen.suit === '♥' || queen.suit === '♦',
      onChange: (next) => updateDraft({ queens: data.queens.map((q, j) => (j === i ? next : q)) }),
    }));
    const diamondsBlock = () => CountBlock({
      names, counts: data.diamonds, unit: 'diamonds', note: '−10 each',
      onChange: (diamonds) => updateDraft({ diamonds }),
    });

    const fields = {
      complex:      () => [tricksBlock(), kingBlock(), queenBlocks(), diamondsBlock()],
      collection:   () => tricksBlock(),
      kingOfHearts: () => kingBlock(),
      queens:       () => queenBlocks(),
      diamonds:     () => diamondsBlock(),
      trix:         () => TrixOrder({ names, order: data.order, onChange: (order) => updateDraft({ order }) }),
    };

    return el('div', { class: 'sheet-wrap', onClick: closeSheet },
      el('div', { class: 'sheet', onClick: (e) => e.stopPropagation() },
        el('div', { class: 'sheet-grab', onPointerdown: grabToDismiss(closeSheet) },
          el('div', { class: 'handle' }),

          el('header', { class: 'sheet-head' },
            el('div', null,
              el('h2', { class: contract.red ? 'red' : '' },
                el('span', { class: 'sheet-glyph' }, contract.glyph), ' ', contract.name),
              el('p', { class: 'ar' }, contract.ar),
            ),
            el('button', { class: 'ghost', onClick: closeSheet }, 'Close'),
          ),
        ),

        el('div', { class: 'sheet-body' },
          el('div', { class: 'stack' }, fields[key]()),
          conflicts.length > 0 &&
            el('div', { class: 'conflict' }, conflicts.map((note) => el('p', null, note))),
        ),

        el('footer', { class: 'sheet-foot' },
          preview && el('div', { class: 'preview' }, names.map((name, i) =>
            el('div', null,
              el('span', { class: 'preview-name' }, name),
              el('span', {
                class: classes('preview-value', preview[i] > 0 ? 'up' : preview[i] < 0 ? 'down' : ''),
              }, signed(preview[i])),
            ),
          )),
          missing.length > 0 &&
            el('p', { class: 'needed' }, 'Still needed: ', el('b', null, joinNames(missing))),
          el('div', { class: 'sheet-actions' },
            index != null && el('button', { class: 'danger', onClick: () => deleteHand(index) }, 'Delete'),
            el('button', { class: 'primary', disabled: !complete, onClick: saveHand },
              index != null ? 'Save changes' : 'Save hand'),
          ),
        ),
      ),
    );
  }

  /* ========================================================================
     History sheet
     ====================================================================== */

  function HistorySheet() {
    const { gameId } = state.history;
    const past = gameId ? state.archive.find((entry) => entry.id === gameId) : null;
    const game = past || state.game;
    if (!game) return null;   // the game was deleted out from under the sheet

    const { names, startIdx, hands, mode } = game;
    const perKingdom = MODES[mode].contracts.length;
    const totals = runningTotals(hands);
    const finished = hands.length === perKingdom * KINGDOMS;
    const result = outcomeOf(names, totals);
    const armed = past && state.confirmDelete === past.id;

    // Once the game is over the table is ordered by rank, so it reads top-to-bottom
    // with the podium and the winner sits in the leftmost column.
    const leader = zeroes();
    result.ranked.forEach(({ player, place }) => { leader[player] = place === 1; });
    const seats = finished ? result.ranked.map((entry) => entry.player) : names.map((_, i) => i);

    // Only rendered when a past game is open while another is in play. It goes inside
    // the scaled block on a finished card so it cannot be double-rendered.
    const back = past && state.game && !finished &&
      el('button', { class: 'toggle back', onClick: () => openHistory() }, '← Back to this game');
    const backInFit = past && state.game && finished &&
      el('button', { class: 'toggle back', onClick: () => openHistory() }, '← Back to this game');
    const resumable = past && !finished;

    const subtitle = [
      past && shortDate(gameDate(past)),
      finished
        ? `Final result · ${result.text}`
        : `${hands.length} hand${hands.length === 1 ? '' : 's'} played`,
    ].filter(Boolean).join(' · ');

    return el('div', { class: 'sheet-wrap', onClick: closeHistory },
      el('div', { class: 'sheet', onClick: (e) => e.stopPropagation() },
        el('div', { class: 'sheet-grab', onPointerdown: grabToDismiss(closeHistory) },
          el('div', { class: 'handle' }),

          el('header', { class: 'sheet-head' },
            el('div', null,
              el('h2', null, past ? 'Past game' : 'Scorecard'),
              el('p', { class: 'sheet-sub' }, subtitle),
            ),
            el('button', { class: 'ghost', onClick: closeHistory }, 'Close'),
          ),
        ),

        el('div', { class: classes('sheet-body', finished && 'fitted') },
          back,

          finished
            // One block, no labels, scaled to fit — a screenshot of the whole result.
            ? el('div', { class: 'fit' }, el('div', { class: 'fit-inner' },
                backInFit,
                el('div', { class: 'podium' }, result.ranked.map(({ player, points, place }) =>
                  el('div', { class: classes('podium-seat', place === 1 && 'lead') },
                    el('span', { class: 'podium-place' }, PLACES[place - 1]),
                    el('span', { class: 'podium-name' }, names[player]),
                    el('span', { class: classes('podium-score', points < 0 && 'down') }, signed(points)),
                  ),
                )),
                Ledger({ names, startIdx, hands, perKingdom, totals, seats, leader, final: true }),
              ))
            : [
                el('p', { class: 'label first' }, 'Standings so far'),
                el('div', { class: 'ranks' }, result.ranked.map(({ player, points, place }) =>
                  el('div', { class: classes('rank', 'on', place === 1 && 'lead') },
                    el('span', { class: 'place' }, PLACES[place - 1]),
                    el('span', { class: 'rank-name' }, names[player]),
                    el('span', { class: classes('points', points < 0 && 'down') }, signed(points)),
                  ),
                )),
                el('p', { class: 'label' }, 'Every hand'),
                Ledger({ names, startIdx, hands, perKingdom, totals, seats, leader }),
              ],
        ),

        el('footer', { class: 'sheet-foot' },
          past && el('div', { class: 'sheet-actions' },
            el('button', {
              class: classes('danger', !resumable && 'wide', armed && 'armed'),
              onClick: () => (armed ? deleteArchived(past.id) : setState({ confirmDelete: past.id })),
            }, armed ? 'Delete for good?' : resumable ? 'Delete' : 'Delete this game'),
            resumable &&
              el('button', { class: 'primary', onClick: () => resumeGame(past) }, 'Resume this game'),
          ),
          el('div', { class: 'sheet-actions' },
            navigator.share &&
              el('button', { class: 'secondary', onClick: () => shareHistory(game) }, 'Share'),
            el('button', { class: 'primary', onClick: () => copyHistory(game) }, 'Copy scorecard'),
          ),
        ),
      ),
    );
  }

  // Hand-by-hand points, grouped into the kingdom each hand belongs to. `seats` is the
  // column order — rank once the game is over, so the table lines up with the podium
  // above it and the winner reads leftmost.
  function Ledger({ names, startIdx, hands, perKingdom, totals, seats, leader, final }) {
    const rows = [];
    const lead = (player) => leader && leader[player] && 'lead';

    hands.forEach((hand, i) => {
      if (i % perKingdom === 0) {
        const kingdom = i / perKingdom;
        rows.push(el('tr', { class: 'ledger-kingdom' },
          el('td', { colSpan: seats.length + 1 },
            `Kingdom ${kingdom + 1} · ${names[(startIdx + kingdom) % PLAYERS]}`),
        ));
      }
      const scores = scoreHand(hand);
      rows.push(el('tr', null,
        el('th', { class: 'ledger-contract', scope: 'row' }, CONTRACTS[hand.contract].name),
        seats.map((player) =>
          el('td', {
            class: classes('ledger-value', scores[player] === 0 && 'zero',
              scores[player] > 0 && 'up', scores[player] < 0 && 'down'),
          }, signed(scores[player]))),
      ));
    });

    return el('div', { class: 'ledger-wrap' },
      el('table', { class: classes('ledger', final && 'final') },
        el('thead', null, el('tr', null,
          el('td', null),
          seats.map((player) =>
            el('th', { class: classes(lead(player)), scope: 'col' }, names[player])),
        )),
        el('tbody', null, rows),
        el('tfoot', null, el('tr', null,
          el('th', { scope: 'row' }, 'Total'),
          seats.map((player) =>
            el('td', {
              class: classes('ledger-value', lead(player), totals[player] < 0 && 'down'),
            }, signed(totals[player]))),
        )),
      ),
    );
  }

  /* ========================================================================
     Sheet fields
     ====================================================================== */

  function PlayerPicker({ names, selected, onPick }) {
    return el('div', { class: 'picker tight' }, names.map((name, i) =>
      el('button', { class: classes('chip', selected === i && 'on'), onClick: () => onPick(i) }, name),
    ));
  }

  // Who took one penalty card, and — if it was doubled — how that double settles.
  function TakerBlock({ names, entry, label, note, red, onChange }) {
    const patch = (changes) => onChange({ ...entry, ...changes });
    const doubledThemselves = entry.doubled && entry.doubledBy != null && entry.taker === entry.doubledBy;

    return el('div', { class: classes('block', entry.taker != null && 'filled') },
      el('div', { class: 'block-label' },
        el('span', { class: red ? 'red' : '' }, label),
        el('span', { class: 'block-meta' },
          note && el('span', { class: 'note' }, note),
          el('button', {
            class: classes('double', entry.doubled && 'on'),
            onClick: () => patch({ doubled: !entry.doubled, doubledBy: null, selfLed: false, leader: null }),
          }, '×2'),
        ),
      ),

      PlayerPicker({ names, selected: entry.taker, onPick: (taker) => patch({ taker }) }),

      entry.doubled && el('div', { class: 'nested' },
        el('p', { class: 'sublabel' }, 'Who exposed it?'),
        PlayerPicker({ names, selected: entry.doubledBy, onPick: (doubledBy) => patch({ doubledBy }) }),

        doubledThemselves && [
          el('button', {
            class: classes('toggle', entry.selfLed && 'on'),
            onClick: () => patch({ selfLed: !entry.selfLed, leader: null }),
          }, 'They led it themselves'),
          !entry.selfLed && [
            el('p', { class: 'sublabel' }, 'Who led that trick?'),
            PlayerPicker({ names, selected: entry.leader, onPick: (leader) => patch({ leader }) }),
          ],
        ],
      ),
    );
  }

  // How many tricks / diamonds each player took — the counts must add up to 13.
  function CountBlock({ names, counts, unit, note, onChange }) {
    const left = TRICKS_PER_HAND - sum(counts);

    const nudge = (i, by) => {
      const next = [...counts];
      next[i] = Math.max(0, Math.min(TRICKS_PER_HAND, next[i] + by));
      if (sum(next) <= TRICKS_PER_HAND) onChange(next);
    };
    const takeRest = (i) => {
      if (left <= 0) return;
      const next = [...counts];
      next[i] += left;
      onChange(next);
    };

    return el('div', { class: classes('block', left === 0 && 'filled') },
      el('div', { class: 'block-label' },
        el('span', null, `How many ${unit} did each player take?`),
        el('span', { class: 'block-meta' },
          note && el('span', { class: 'note' }, note),
          el('span', { class: classes('remaining', left === 0 && 'done') }, `${left} left`),
        ),
      ),

      names.map((name, i) =>
        el('div', { class: 'counter' },
          el('span', { class: 'counter-name' }, name),
          el('button', { class: 'step', onClick: () => nudge(i, -1) }, '−'),
          el('button', { class: 'count', onClick: () => takeRest(i) }, counts[i]),
          el('button', { class: 'step', onClick: () => nudge(i, 1) }, '+'),
        ),
      ),

      left > 0 && el('p', { class: 'hint' }, "Tap a number to give it everything that's left."),
    );
  }

  // The order players went out in a Trix hand.
  function TrixOrder({ names, order, onChange }) {
    return el('div', { class: classes('block', order.length === PLAYERS && 'filled') },
      el('div', { class: 'block-label' },
        el('span', null, 'Tap players in the order they went out'),
      ),

      el('div', { class: 'ranks' }, TRIX_POINTS.map((points, place) =>
        el('div', { class: classes('rank', order[place] != null && 'on') },
          el('span', { class: 'place' }, PLACES[place]),
          el('span', { class: 'rank-name' }, order[place] != null ? names[order[place]] : '—'),
          el('span', { class: 'points' }, `+${points}`),
        ),
      )),

      el('div', { class: 'picker tight' }, names.map((name, i) =>
        el('button', {
          class: 'chip',
          disabled: order.includes(i),
          onClick: () => onChange([...order, i]),
        }, name),
      )),

      order.length > 0 &&
        el('button', { class: 'toggle', onClick: () => onChange(order.slice(0, -1)) }, 'Undo last pick'),
    );
  }

  /* ========================================================================
     Colophon
     ====================================================================== */

  function Colophon() {
    return el('footer', { class: 'colophon' },
      el('span', null, 'Built by'),
      el('a', {
        href: 'https://hanialkarrain.com',
        target: '_blank',
        rel: 'noopener noreferrer',
      }, 'hanialkarrain.com'),
    );
  }

  render();
})();
</script>
</body>
</html>
