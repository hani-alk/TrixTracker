@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap');

.app {
  --bg:#12151C; --panel:#1A1F29; --panel2:#232A38; --line:#2E3646;
  --text:#E9EBF1; --dim:#7E8799; --gold:#E8B84B; --red:#E45C70;
  font-family:'Bricolage Grotesque', system-ui, sans-serif;
  background:var(--bg); color:var(--text);
  min-height:100vh; padding:18px 16px 40px; max-width:520px; margin:0 auto;
  -webkit-tap-highlight-color:transparent;
}
.app * { box-sizing:border-box; }
.app button { font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
.app h1,.app h2 { margin:0; font-weight:800; letter-spacing:-0.02em; }
.app p { margin:0; }
.loading { color:var(--dim); padding:40px 0; text-align:center; }

.brand { text-align:center; margin:28px 0 22px; }
.brand h1 { font-size:44px; }
.ar { color:var(--dim); font-size:15px; }
.hint { color:var(--dim); font-size:12px; line-height:1.5; margin:0 0 16px; }
.label { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:0.1em; margin:22px 0 10px; }
.stack { display:flex; flex-direction:column; gap:8px; }

.field {
  width:100%; padding:14px 16px; font:inherit; font-size:16px;
  background:var(--panel); border:1px solid var(--line); border-radius:12px; color:var(--text);
}
.field:focus { outline:2px solid var(--gold); outline-offset:1px; }
.field::placeholder { color:#59616F; }

.picker { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.picker.tight { gap:6px; }
.chip {
  padding:13px 8px; border-radius:11px; background:var(--panel2); border:1px solid var(--line);
  font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.chip.on { background:var(--gold); border-color:var(--gold); color:#171308; }
.chip:disabled { opacity:0.3; }

.mode { text-align:left; padding:14px 16px; border-radius:12px; background:var(--panel); border:1px solid var(--line); display:flex; flex-direction:column; gap:3px; }
.mode.on { border-color:var(--gold); background:rgba(232,184,75,0.08); }
.mname { font-size:15px; font-weight:700; }
.mode.on .mname { color:var(--gold); }
.mblurb { font-size:12px; color:var(--dim); line-height:1.4; }

.primary { width:100%; margin-top:20px; padding:16px; border-radius:13px; background:var(--gold); color:#171308; font-size:16px; font-weight:800; }
.primary:disabled { background:var(--panel2); color:#5C6474; }
.danger { padding:16px 18px; border-radius:13px; background:var(--panel2); color:var(--red); font-weight:700; }
.ghost { padding:8px 12px; border-radius:9px; background:var(--panel); border:1px solid var(--line); font-size:13px; color:var(--dim); }
.toggle { width:100%; margin-top:8px; padding:12px; border-radius:10px; background:var(--panel2); border:1px solid var(--line); font-size:13px; font-weight:600; color:var(--dim); }
.toggle.on { background:var(--gold); border-color:var(--gold); color:#171308; }

.top { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
.top h1 { font-size:26px; }
.eyebrow { color:var(--gold); font-size:12px; font-weight:600; margin-top:3px; }
.tools { display:flex; gap:6px; }

.scores { margin-top:18px; background:var(--panel); border:1px solid var(--line); border-radius:16px; overflow:hidden; }
.row { display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line); }
.row:last-child { border-bottom:none; }
.row.winner { background:rgba(232,184,75,0.09); }
.who { flex:1; display:flex; align-items:center; gap:8px; min-width:0; }
.nm { font-size:16px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tag { font-size:9px; letter-spacing:0.1em; text-transform:uppercase; color:var(--gold); border:1px solid rgba(232,184,75,0.4); border-radius:5px; padding:2px 5px; flex:none; }
.delta { font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--dim); }
.delta.up { color:rgba(232,184,75,0.75); }
.delta.down { color:rgba(228,92,112,0.75); }
.total { font-family:'JetBrains Mono', monospace; font-size:21px; font-weight:700; min-width:74px; text-align:right; font-variant-numeric:tabular-nums; }
.total.up { color:var(--gold); }
.total.down { color:var(--red); }
.warn { margin-top:10px; padding:10px 14px; border-radius:11px; background:rgba(228,92,112,0.12); color:var(--red); font-size:13px; }

.tiles { display:grid; gap:8px; }
.tile { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px 6px 14px; display:flex; flex-direction:column; align-items:center; gap:5px; }
.tile:active { background:var(--panel2); }
.glyph { font-size:28px; font-weight:800; line-height:1; }
.tile.red .glyph { color:var(--red); }
.tname { font-size:14px; font-weight:600; }
.tcost { font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--dim); }

.grid { display:flex; flex-direction:column; gap:6px; }
.krow { display:flex; align-items:center; gap:10px; }
.kname { flex:1; font-size:13px; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cells { display:flex; gap:6px; flex:none; }
.cell { width:38px; height:38px; border-radius:10px; background:var(--panel); border:1px solid var(--line); font-size:15px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:6px; }
.cell.wide { width:96px; }
.cellname { font-size:12px; font-weight:600; color:var(--dim); }
.cell.red { color:var(--red); }
.cell.empty { background:transparent; border-style:dashed; opacity:0.4; }
.cell.next { border-color:var(--gold); border-style:solid; opacity:1; animation:pulse 2s ease-in-out infinite; }
@keyframes pulse { 50% { border-color:var(--line); } }

.sheet-wrap { position:fixed; inset:0; background:rgba(6,8,12,0.72); display:flex; align-items:flex-end; justify-content:center; z-index:50; }
.sheet {
  width:100%; max-width:520px; max-height:94vh; display:flex; flex-direction:column;
  background:var(--bg); border:1px solid var(--line); border-bottom:none;
  border-radius:22px 22px 0 0; padding:8px 16px calc(16px + env(safe-area-inset-bottom));
  animation:rise 0.22s ease-out;
}
@keyframes rise { from { transform:translateY(24px); } }
.handle { width:38px; height:4px; border-radius:2px; background:var(--line); margin:0 auto 12px; }
.shead { display:flex; justify-content:space-between; align-items:flex-start; padding-bottom:14px; border-bottom:1px solid var(--line); }
.shead h2 { font-size:20px; display:flex; align-items:center; gap:8px; }
.sglyph { font-size:22px; }
.shead h2.red .sglyph { color:var(--red); }
.sbody { flex:1; overflow-y:auto; padding:16px 0; }

.block { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; }
.block.filled { border-color:rgba(232,184,75,0.28); }
.blabel { display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:14px; font-weight:600; margin-bottom:12px; }
.blabel .red { color:var(--red); }
.right { flex:none; display:flex; align-items:center; gap:8px; }
.note { font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--dim); }
.sublabel { font-size:12px; color:var(--dim); margin:12px 0 8px; }
.nested { margin-top:12px; padding-top:12px; border-top:1px dashed var(--line); }
.x2 { padding:6px 10px; border-radius:8px; border:1px solid var(--line); background:var(--panel2); font-size:12px; font-weight:700; color:var(--dim); font-family:'JetBrains Mono', monospace; }
.x2.on { background:var(--gold); border-color:var(--gold); color:#171308; }

.counter { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.cname { flex:1; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.step { width:46px; height:46px; border-radius:11px; background:var(--panel2); border:1px solid var(--line); font-size:20px; font-weight:700; }
.step:active { background:var(--gold); color:#171308; }
.num { width:52px; height:46px; border-radius:11px; background:var(--panel2); border:1px solid var(--line); font-family:'JetBrains Mono', monospace; font-size:17px; font-weight:700; }
.left { font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--red); }
.left.done { color:var(--gold); }

.ranks { display:flex; flex-direction:column; gap:6px; margin-bottom:12px; }
.rank { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; background:var(--panel2); border:1px solid var(--line); opacity:0.5; }
.rank.on { opacity:1; border-color:rgba(232,184,75,0.35); }
.place { font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--dim); width:28px; }
.rname { flex:1; font-size:14px; font-weight:600; }
.pts { font-family:'JetBrains Mono', monospace; font-size:13px; color:var(--gold); }

.conflict { margin-top:12px; padding:12px 14px; border-radius:12px; background:rgba(228,92,112,0.1); border:1px solid rgba(228,92,112,0.28); }
.conflict p { color:var(--red); font-size:12.5px; line-height:1.5; }

.sfoot { border-top:1px solid var(--line); padding-top:12px; }
.preview { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:10px; }
.preview > div { display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 2px; background:var(--panel); border-radius:10px; }
.pname { font-size:10px; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%; }
.pval { font-family:'JetBrains Mono', monospace; font-size:14px; font-weight:700; color:var(--dim); }
.pval.up { color:var(--gold); }
.pval.down { color:var(--red); }
.srow { display:flex; gap:8px; }
.srow .primary { margin-top:0; }

@media (prefers-reduced-motion:reduce) { .app * { animation:none !important; } }
